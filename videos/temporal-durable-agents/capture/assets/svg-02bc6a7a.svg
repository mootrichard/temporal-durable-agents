
<svg
  xmlns="http://www.w3.org/2000/svg"
  version="1.1"
  xmlns:xlink="http://www.w3.org/1999/xlink"
  xmlns:svgjs="http://svgjs.dev/svgjs"
  viewBox="0 0 700 700"
  width="700"
  height="700"
  ><defs
    ><linearGradient
      gradientTransform="rotate(-11, 0.5, 0.5)"
      x1="50%"
      y1="0%"
      x2="50%"
      y2="100%"
      id="gggrain-gradient2"
      ><stop
        stop-color="hsl(194, 83%, 49%)"
        stop-opacity="1"
        offset="-0%"
      /><stop
        stop-color="rgba(255,255,255,0)"
        stop-opacity="0"
        offset="100%"
      /></linearGradient
    ><linearGradient
      gradientTransform="rotate(11, 0.5, 0.5)"
      x1="50%"
      y1="0%"
      x2="50%"
      y2="100%"
      id="gggrain-gradient3"
      ><stop stop-color="hsl(227, 100%, 50%)" stop-opacity="1" /><stop
        stop-color="rgba(255,255,255,0)"
        stop-opacity="0"
        offset="100%"
      /></linearGradient
    ><filter
      id="gggrain-filter"
      x="-20%"
      y="-20%"
      width="140%"
      height="140%"
      filterUnits="objectBoundingBox"
      primitiveUnits="userSpaceOnUse"
      color-interpolation-filters="sRGB"
    >
      <feTurbulence
        type="fractalNoise"
        baseFrequency="1.25"
        numOctaves="2"
        seed="234"
        stitchTiles="stitch"
        x="0%"
        y="0%"
        width="100%"
        height="100%"
        result="turbulence"
      />
    </filter></defs
  ><g
    ><rect
      width="1000%"
      height="1000%"
      fill="transparent"
      filter="url(#gggrain-filter)"
      opacity="0.1"
      style="mix-blend-mode: soft-light"
    /></g
  ></svg
>
