      <script type="application/hyperframes-slideshow+json">
      {
        "slides": [
          { "sceneId": "cover", "notes": "Open with the practical framing. Agent systems are more than model calls: they hold a plan, delegate work, wait, resume, and produce evidence. The talk asks who owns that continuation when compute disappears." },
          { "sceneId": "agent-tree", "notes": "Define the relationship. The main agent decomposes and integrates. Each subagent receives a bounded assignment, gets its own thread, and returns evidence. In this demo, investigators are read-only; only the resumed main thread writes." },
          { "sceneId": "agent-loop", "notes": "Walk left to right. Plan, fan out, wait, resume, verify. The important state lives between calls: assignments, thread IDs, completed results, and the next step." },
          { "sceneId": "the-build", "notes": "The job is intentionally small: change one retry-loop boundary. Both implementations use the same plan, investigators, tests, Codex runner, and Git workspace shape. Only orchestration ownership changes." },
          { "sceneId": "baseline-owner", "notes": "Scenario 1 is ordinary process-owned orchestration. One Node.js process holds the promises, the branch-result mapping, the current phase, and the continuation." },
          { "sceneId": "baseline-plan", "notes": "The main Codex thread returns a schema-validated plan with exactly two assignments. The process parses it and keeps the resulting values in memory." },
          { "sceneId": "baseline-fanout", "notes": "The process starts both investigators and the initial test run before awaiting. These are real concurrent operations: two separate Codex threads and one test job that runs a Vitest subprocess per file." },
          { "sceneId": "baseline-resume", "notes": "After the join, the application resumes the planner thread in workspace-write mode and includes both reports plus the failing test output. The main thread becomes the implementer." },
          { "sceneId": "baseline-kill", "notes": "The supervisor sends SIGKILL to the exact detached process group. The baseline orchestrator, Codex subprocesses, and Vitest subprocesses all disappear together. The API survives only to display its cached receipt." },
          { "sceneId": "baseline-restart", "notes": "Restart reuses a supervisor run label, but it creates a clean workspace, a new initial snapshot, and a fresh process. Zero turns and zero tests make the lost continuation visible." },
          { "sceneId": "temporal-shift", "notes": "Temporal changes the owner of the continuation. Event History records orchestration decisions and completed results. Workers still execute code, and Git and local Codex sessions still own their respective external state." },
          { "sceneId": "temporal-start", "notes": "The supervisor starts FixWorkflow with a stable Workflow ID and run-specific Task Queue, then launches a Worker. A Workflow Execution can exist before compute begins polling." },
          { "sceneId": "temporal-workflow", "notes": "The TypeScript sequence stays recognizable. Workflow code schedules the plan, starts three independent branches, waits, schedules implementation, verifies, and collects the diff. Replay reconstructs this control flow from Event History; it does not restore a JavaScript heap." },
          { "sceneId": "temporal-branches", "notes": "Each investigator is now a Child Workflow with a stable ID and separate Event History. Codex calls and tests remain Activities because they perform external, nondeterministic work. The parent still waits for the same three results." },
          { "sceneId": "temporal-kill", "notes": "Use the exact same physical failure. Worker, Workflow isolate, Activity stacks, Codex, and Vitest disappear. The open Workflow ID, Event History, recorded results, delivered heartbeat details, and Git workspace remain. This demo proves Worker-process recovery on one machine, not machine loss." },
          { "sceneId": "temporal-replay", "notes": "A replacement Worker polls the same Task Queue. Workflow replay executes FixWorkflow from the top, substitutes recorded results for completed operations, and creates a new Activity Task Execution only for unfinished work after failure detection and retry delay." },
          { "sceneId": "temporal-heartbeats", "notes": "Activity retry uses application checkpoints. A Codex Activity reads the most recently delivered thread ID and resumes that local session when available. A test Activity reads heartbeated filenames and skips recorded files. A heartbeat is a resumability hint, not completion." },
          { "sceneId": "temporal-finish", "notes": "The same Workflow ID and workspace reach completion under replacement compute. Final verification reaches four of four files and the run returns one bounded Git diff." },
          { "sceneId": "boundary", "notes": "Keep the guarantee precise. Temporal owns orchestration identity, history, replay, failure detection, retries, and recorded results. Application code still owns idempotency, reconciliation, model correctness, and durable artifact storage. External effects can repeat if completion was not recorded." },
          { "sceneId": "close", "notes": "Close on the design principle. An agent run is an execution tree. Put its continuation somewhere that outlives any one Worker. Then compute becomes replaceable instead of existential." }
        ],
        "slideSequences": []
      }
      </script>
