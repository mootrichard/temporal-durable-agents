          { "sceneId": "cover", "notes": "Open on the thesis, then set the contract for this version: we will follow the actual TypeScript call path. The audience will see which process runs each line, which facts reach Temporal, and exactly what replacement compute reconstructs." },

          { "sceneId": "trace-policy", "notes": "The Activity proxy applies a ten-minute attempt bound, a twenty-second heartbeat timeout, and up to five attempts with one-to-ten-second backoff. The heartbeat timeout is the failure detector used after SIGKILL." },

          { "sceneId": "trace-codex", "notes": "LiveCodexRunner chooses resumeThread or startThread and consumes streamed events. thread.started produces the resumable session ID; item events update progress and lastItemId; turn.completed provides usage. Temporal sees this stream through heartbeat details and the final Activity result." },
          { "sceneId": "trace-heartbeat", "notes": "Reveal the three heartbeat paths. The five-second lease repeats current payload during quiet model time. Checkpoints immediately write threadId and lastItemId. Progress immediately writes the latest normalized trace event. A heartbeat means liveness and checkpoint state; completion is a separate event.", "fragments": [136.7, 138.2, 139.8] },
